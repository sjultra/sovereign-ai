apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      {{- with .Values.openwebui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openwebui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openwebui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openwebui
          image: "{{ .Values.openwebui.image.repository }}:{{ .Values.openwebui.image.tag }}"
          imagePullPolicy: {{ .Values.openwebui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.openwebui.service.port }}
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:{{ .Values.ollama.service.port }}"
            - name: WEBUI_AUTH
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.openwebui.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.openwebui.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12

---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  labels:
    app: openwebui
spec:
  type: NodePort
  selector:
    app: openwebui
  ports:
    - name: http          # LAN access at http://<node-ip>:<nodePort>; public traffic goes nginx → Traefik → Ingress
      protocol: TCP
      port: 80
      targetPort: {{ .Values.openwebui.service.port }}
      nodePort: {{ .Values.openwebui.service.nodePort }}
{{- if .Values.openwebui.ingress.enabled }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  annotations:
    kubernetes.io/ingress.class: "traefik"  # TLS is terminated by nginx on the proxy host, which forwards to Traefik
spec:
  rules:
    - host: {{ required "openwebui.ingress.host is required when openwebui.ingress.enabled is true" .Values.openwebui.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  number: 80
{{- end }}